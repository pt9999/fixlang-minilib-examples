[general]
name = "probable-primes"
version = "0.1.0"
fix_version = "1.6.0"
authors = ["pt9999"]
license = "MIT"

[build]
output = "probable_primes.out"
threaded = true
opt_level = "max"
files = [
    "probable_primes.fix",
    "bigint_prime.fix",
]

[build.test]
threaded = true
opt_level = "basic"
files = [
    "tests/test.fix",
    "tests/bigint_prime_test.fix",
]

[[dependencies]]
name = "asynctask"
version = "*"
git = { url = "https://github.com/tttmmmyyyy/fixlang-asynctask.git" }

[[dependencies]]
name = "random"
version = "*"
git = { url = "https://github.com/tttmmmyyyy/fixlang-random.git" }

[[dependencies]]
name = "time"
version = "*"
git = { url = "https://github.com/tttmmmyyyy/fixlang-time.git" }

[[dependencies]]
name = "minilib-common"
version = "*"
git = { url = "https://github.com/pt9999/fixlang-minilib-common.git" }

[[dependencies]]
name = "minilib-monad"
version = "*"
git = { url = "https://github.com/pt9999/fixlang-minilib-monad.git" }

[[dependencies]]
name = "minilib-app"
version = "*"
# path = "../../fixlang-minilib-app"
git = { url = "https://github.com/pt9999/fixlang-minilib-app.git" }

[[dependencies]]
name = "minilib-math"
version = "*"
# path = "../../fixlang-minilib-math"
